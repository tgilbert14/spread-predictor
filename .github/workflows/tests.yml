# Run the test suite on every push and pull request. Needs no API key and
# does not install cfbfastR: the pipeline tests use fake data.

name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Windows is included because that is where the app is developed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # "hard" installs Imports only, which leaves out cfbfastR (a Suggest).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::testthat

      - name: Run tests
        shell: Rscript {0}
        run: testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
