# Scheduled data refresh. Runs scripts/refresh.R: pulls this week's SP+, FPI,
# SRS and Elo, refreshes the current season's games and lines, rebuilds the
# database and the app data, saves this week's predictions before kickoff,
# grades the saved ones, audits the data, and commits what changed.
#
# When it runs (UTC):
#   Tuesday 13:00          after the weekend's games and before the next
#                          week's first kickoff: new ratings, predictions saved.
#   Tuesday 18:00          the same run again, as a safety net. If the first
#                          one failed, this one saves the week's predictions
#                          while there is still time before the first kickoff.
#                          If it worked, this only refreshes games and lines:
#                          saved files are never rewritten.
#   Thursday, Friday 21:00 lines refreshed before the weekend, so the app shows
#                          how far they have moved. Game notes are added to
#                          data/notes.csv on these days by a separate check.
# It can also be started by hand, with a choice of task.

name: Weekly snapshot

on:
  schedule:
    - cron: "0 13 * * 2"
    - cron: "0 18 * * 2"
    - cron: "0 21 * * 4"
    - cron: "0 21 * * 5"
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        default: refresh
        options:
          - refresh    # snapshot, rebuild, save and grade predictions, audit
          - extras     # research data: talent, returning production, efficiency stats
          - backfill   # history for every season in TRAINING_SEASONS, plus the research data
          - fit        # refit the model, rebuild the app data, rerun the backtest and the spread study
          - manifest   # write manifest.json for deploying the app

permissions:
  contents: write

# Never run two at once: both would try to push.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      # fit and manifest work only with files already in the repo.
      - name: Check for the API key
        if: ${{ inputs.task != 'fit' && inputs.task != 'manifest' }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "::error::The CFBD_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions > New repository secret, then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::cfbfastR

      # rsconnect is only needed to write the manifest, so it is not a project
      # dependency. cpp11 is a build-time dependency of several packages that
      # binary installs skip, and the manifest writer insists on finding it.
      - name: Install rsconnect
        if: ${{ inputs.task == 'manifest' }}
        run: Rscript -e 'install.packages(c("rsconnect", "cpp11"))'

      # Scheduled runs have no inputs, so they take the refresh.
      - name: Run the task
        id: snapshot
        run: |
          case "${{ inputs.task }}" in
            extras)
              Rscript scripts/pull_extras.R ;;
            backfill)
              Rscript scripts/backfill.R
              Rscript scripts/pull_extras.R ;;
            fit)
              Rscript scripts/fit.R
              Rscript scripts/refresh.R --offline
              # Re-judge the candidate factors and the spread study on the new fit.
              Rscript scripts/backtest.R
              Rscript scripts/disagreement.R ;;
            manifest)
              Rscript scripts/write_manifest.R ;;
            *)
              Rscript scripts/refresh.R ;;
          esac

      # Runs even if one step failed, so the files that did arrive are kept.
      # Snapshot and prediction files are append-only, so this is always safe.
      # Pulls first, so a commit pushed by someone else meanwhile does not
      # make the push fail.
      - name: Commit changes
        if: ${{ !cancelled() && steps.snapshot.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          for file in data/app_data.rds data/params.json docs/data-audit.md docs/backtest-results.md docs/market-disagreement.md manifest.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          # Someone else can push between our pull and our push, so try a
          # few times before giving up.
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            echo "Push attempt $attempt failed. Trying again."
            sleep 10
          done
          exit 1
