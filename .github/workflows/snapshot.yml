# Weekly ratings snapshot. Pulls this week's SP+, FPI, SRS and Elo, refreshes
# the current season's games and lines, and commits any new files in
# data/snapshots/. Runs Tuesdays at 13:00 UTC, after the weekend's games and
# before the next week's first kickoff. Can also be started by hand.

name: Weekly snapshot

on:
  schedule:
    - cron: "0 13 * * 2"
  workflow_dispatch:
    inputs:
      task:
        description: "What to pull"
        type: choice
        default: snapshot
        options:
          - snapshot   # this week's ratings, games and lines
          - extras     # research data: talent, returning production, efficiency stats

permissions:
  contents: write

# Never run two snapshots at once: both would try to push.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - name: Check for the API key
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "::error::The CFBD_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions > New repository secret, then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::cfbfastR

      # The scheduled run has no inputs, so it takes the weekly snapshot.
      - name: Take the snapshot
        id: snapshot
        run: |
          if [ "${{ inputs.task }}" = "extras" ]; then
            Rscript scripts/pull_extras.R
          else
            Rscript scripts/snapshot.R
          fi

      # Runs even if one snapshot step failed, so the files that did arrive
      # are kept. Snapshot files are append-only, so this is always safe.
      - name: Commit new snapshot files
        if: ${{ !cancelled() && steps.snapshot.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "Snapshot $(date -u +%Y-%m-%d)"
          git push
